spring:
  application:
    name: tessera-api

  config:
    import: classpath:application-sensitive.yml

  # MySQL is the no-flag default, the same shape every product in this workspace now uses. H2 used
  # to be the default here and is gone entirely: an H2 file running MODE=PostgreSQL made local dev
  # green against a dialect nothing is ever deployed on, so a MySQL-only failure was only ever
  # discovered later. PostgreSQL stays available as the opt-in `postgresql` profile below.
  datasource:
    url: ${TESSERA_DB_URL:jdbc:mysql://localhost:3306/tessera?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${TESSERA_DB_USERNAME:tessera}
    password: ${TESSERA_DB_PASSWORD:tessera}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TESSERA-POOL
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    # ⚠️ 0, and it is load-bearing rather than tidy. `baseline-on-migrate` baselines a NON-EMPTY schema
    # at `baseline-version`, which defaults to 1 — and Tessera's first migration IS version 1, so it
    # would be skipped as "already applied". That never happened while this schema started empty. It
    # starts non-empty now: `jmouse-ai-jpa` brings its own migrations and its own history table, and
    # they run first so the entity manager can validate against the tables they create.
    #
    # Central hit exactly this and failed on V000002 with "table `translations` doesn't exist" — two
    # steps from the cause. At 0 the baseline sits below everything and every migration still applies.
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TESSERA_IDENTITY_JWK_SET_URI:http://localhost:9090/oauth2/jwks}

  jackson:
    # No `default-property-inclusion: non_null` here, deliberately. Omitting a null field makes the API
    # disagree with the DTO that declares it: the client's mirror types say `string[] | null`, the field
    # arrives as `undefined`, and every `=== null` written against it is silently always false. That is
    # not theoretical — it is what made the board hide every card until a filter was applied, because
    # `matchedCardIds` (null = "no filter was evaluated") simply was not in the payload. A nullable field
    # is part of the contract, so it is sent.
    # ⚠️ Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS out of SerializationFeature into DateTimeFeature, so
    # it lives under `datatype.datetime` now — and the old `serialization.write-dates-as-timestamps` key
    # is simply ignored rather than rejected. Left where it was, every date in the API would have
    # flipped to an epoch number at once, and the client parses them as ISO-8601 strings.
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ⚠️ NO LONGER JUST AVATARS. This used to say "the one multipart route in the whole service is an
  # avatar upload", which stopped being true when an issue gained attachments (TSSR-49): a screenshot
  # of a bug is the commonest one and routinely exceeds what a 256x256 avatar weighs. These are still
  # a socket-level backstop rather than the policy — `tessera.file.max-size-bytes` is the limit that
  # refuses with a message a person can read, and it is the one to change.
  servlet:
    multipart:
      max-file-size: ${TESSERA_MULTIPART_MAX_FILE_SIZE:24MB}
      max-request-size: ${TESSERA_MULTIPART_MAX_REQUEST_SIZE:24MB}

server:
  port: ${TESSERA_SERVER_PORT:8100}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

tessera:

  # ⚠️ THE ONE DIRECTORY `issues_attach` MAY READ A FILE FROM, and it is empty by default.
  #
  # Reading this server's disk on a caller's word is a capability rather than a convenience: unset, the
  # `path` form of the action refuses outright and says so, and only `base64` works. The path is
  # resolved and compared against the resolved root, so `../` climbs out of nothing.
  #
  # Pointed here at where this machine's own assistant uploads land, which is the case it exists for:
  # somebody hands the assistant a screenshot and it puts that screenshot on a ticket.
  protocol:
    upload-root: ${TESSERA_PROTOCOL_UPLOAD_ROOT:}
  security:
    # The audiences this resource server accepts. A token's `aud` claim must contain one of them.
    #
    # ⚠️ THIS USED TO BE ONE FIXED VALUE, on the reasoning "Tessera is only ever called by its own
    # frontend, so one value, not an allow-list". That stopped being true when Kiwi began quoting
    # issues: a Kiwi page carrying `:::issue TSSR-4` is drawn by KIWI'S browser, holding the reader's
    # token with `aud: kiwi`, and Identity stamps exactly ONE audience per registered client.
    #
    # ⚠️ THE VALUE WAS `wiqi` UNTIL 2026-08-20 AND EVERY SUCH CALL WAS 401'd (TSSR-0095). The product
    # was renamed twice on 2026-08-18 — `wiq` → `wiqi` → `kiwi` — and Identity's client now mints
    # `aud: kiwi`, but this list was never moved with it. Nothing said so: the block on the page draws
    # the live-blocks library's "this installation has nothing that answers `issue`" plaque, which
    # blames the namespace row and never mentions a token.
    #
    # ⚠️ EVERY ENTRY IS A PRODUCT WHOSE READERS MAY REACH THIS API with the token they already hold.
    # Adding one widens who this server believes. It is safe because the token is still Identity's,
    # still signed, still that person's — and every route behind it still asks what THEY may see.
    # Central has worked this way for the same reason since it existed.
    accepted-audiences: ${TESSERA_ACCEPTED_AUDIENCES:tessera,kiwi}

    # Origins whose BROWSERS may call this API directly.
    #
    # ⚠️ Tessera had no CORS at all until it started being quoted, which was correct while its only
    # caller was its own interface behind Vite's /api proxy. 5070 is Kiwi's interface; 5010 is
    # `Innoventa/FE`, the NEW Innoventa interface — not the legacy `Innoventa/UI` on 5173, which is
    # deliberately not listed because it is not the one that quotes Tessera. INVT-0095 moved FE onto
    # 5010 rather than moving this value; 5050 is Tessera's own, for a page quoting itself.
    # ⚠️ AN EMPTY VALUE MEANS NO CROSS-ORIGIN CALLER AT ALL — the previous behaviour, kept reachable
    # on purpose.
    allowed-origins: ${TESSERA_ALLOWED_ORIGINS:http://localhost:5070,http://localhost:5010,http://localhost:5050}

    # What this server calls itself: the address a client reaches this API at. Published at
    # /.well-known/oauth-protected-resource as both the resource being protected AND the authorization
    # server that issues credentials for it — Tessera issues the protocol's own, see
    # SecurityConfiguration for why that stopped being Identity's job.
    #
    # ⚠️ IN A DEPLOYMENT THIS IS THE PUBLIC ADDRESS, and it has to match what the client was pointed at
    # scheme-and-host exactly: a client refuses a resource whose origin differs from the server URL it
    # was configured with. Behind a reverse proxy that means the proxy must also forward
    # /.well-known/** to this backend, or discovery is answered with the frontend's HTML.
    resource: ${TESSERA_RESOURCE:http://localhost:8100}

  # The Model Context Protocol's authorization flow — see McpAuthorizationConfiguration.
  mcp:
    # ⚠️ UNSET MEANS "GENERATE ONE PER RUN", which is right on a laptop and wrong everywhere else: every
    # credential dies on restart, and two instances refuse each other's. At least 32 bytes or the
    # application refuses to start — that failure belongs at boot, not at somebody's first connection.
    signing-secret: ${TESSERA_MCP_SIGNING_SECRET:}

    access-token-lifetime: ${TESSERA_MCP_ACCESS_TOKEN_LIFETIME:1h}
    # How long a client may keep renewing before a person approves again.
    refresh-token-lifetime: ${TESSERA_MCP_REFRESH_TOKEN_LIFETIME:30d}

  bootstrap:
    owner: ${TESSERA_BOOTSTRAP_OWNER:SU}

  # Bytes, read by jmouse-storage under the prefix declared in `jmouse.storage.prefix` below.
  #
  # Tessera stores one kind of file: a member's uploaded avatar. Everything here is sized for that and
  # for nothing else, which is why the limit is a megabyte rather than the tens Innoventa and Moneta
  # allow — an avatar arrives already cropped to 256x256, so anything approaching this ceiling is a
  # client that did not do that, and refusing it is correct.
  file:
    # local | aws | minio | supabase — the last three all speak S3. Switching is a change here and
    # nowhere else; a stored row records which backend wrote it, so files already written keep being
    # served from wherever they are.
    provider: ${TESSERA_FILE_PROVIDER:local}
    storage-directory: ${TESSERA_FILE_STORAGE_DIR:./uploads}
    # ⚠️ 20 MB, AND IT IS AN ATTACHMENT LIMIT NOW, not an avatar one. It was 1 MB while the only thing
    # this service accepted was a picture of a person; a screenshot pasted into a bug report clears
    # that on a large monitor, so the old value would have made the commonest attachment impossible.
    # The avatar route is not loosened by this at all: it has its own `tessera.avatar.max-size-bytes`,
    # still 1 MB, and MemberAvatarService narrows the types it accepts on top of that.
    max-size-bytes: ${TESSERA_FILE_MAX_SIZE_BYTES:20971520}

    # ⚠️ NO LONGER "EXACTLY ONE THING: A PICTURE OF A PERSON". That was true while avatars were the
    # only upload; since TSSR-49 an issue carries attachments, so PDF and Office documents are now the
    # point rather than the cost — and since TSSR-77 so are notes, logs and exports.
    #
    # ⚠️ TEXT IS IN NOW, AND ONLY THE INERT KIND. The old profile refused text/plain and text/markdown,
    # so the file a developer reaches for most after a screenshot — a log, a note — was the one that
    # could not be sent. `ALLOW_DOCUMENTS_IMAGES_AND_TEXT` adds txt, md, csv, tsv, json, ndjson, yaml
    # and log, and nothing that executes.
    #
    # ⚠️ SVG, HTML, XHTML, XML AND EVERY JAVASCRIPT TYPE ARE STILL ABSENT, BY NAME. That exclusion is
    # what makes two routes safe rather than lucky: /api/public/avatars/** serves its bytes
    # unauthenticated, and an attachment is served back to whoever can read the issue. They are text by
    # encoding and a script host by specification — widening past them is not a cosmetic change, and
    # this line is the one to revisit if anybody tries.
    #
    # ⚠️ `CUSTOM` WORKS NOW, and this comment used to say the opposite at length. The binder defect it
    # described — a YAML sequence arriving as `contentTypes[0]`, `[1]` and the allow-list binding EMPTY,
    # or a comma-separated string killing the boot with "No binder found for bindable type 'Object'" —
    # was fixed in jmouse-core (`getJavaType` plus ValueObjectIntrospector's component type). Verified
    # here: with `profile: CUSTOM` and a three-entry list, `text/markdown` was accepted and
    # `application/pdf` refused. So an installation that needs its own list can write one:
    #
    #     upload:
    #       profile: CUSTOM
    #       mode: ALLOWLIST          # or DENYLIST
    #       content-types: [image/png, text/markdown]
    #       extensions: [png, md]
    #
    # A named profile is still what Tessera uses, because a hand-written list is a list somebody has to
    # maintain — and a correction to a shipped one reaches every product that chose it.
    #
    # ⚠️ SO THIS IS THE BRACES AND `MemberAvatarService.ACCEPTED_PICTURE_TYPES` IS THE BELT.
    # The avatar endpoint narrows to raster images in its own code rather than this loosening what that
    # route may serve.
    upload:
      profile: ALLOW_DOCUMENTS_IMAGES_AND_TEXT
    # Every avatar is content-addressed, so two people who pick the same picture cost one object.
    content-addressed-keys: ${TESSERA_FILE_CONTENT_ADDRESSED_KEYS:true}

    cache:
      # An avatar URL names a content digest, so its bytes can never change under a cached copy —
      # replacing your picture produces a different URL. The only thing a long lifetime costs is a
      # stale image for somebody who was deleted, which is not a thing that happens.
      streamed-public-max-age: ${TESSERA_FILE_CACHE_PUBLIC_MAX_AGE:365d}
      streamed-private-max-age: ${TESSERA_FILE_CACHE_PRIVATE_MAX_AGE:1h}
      redirect-safety-margin: ${TESSERA_FILE_REDIRECT_SAFETY_MARGIN:1m}

    s3:
      bucket: ${TESSERA_S3_BUCKET:tessera}
      access-key: ${TESSERA_S3_ACCESS_KEY:}
      secret-key: ${TESSERA_S3_SECRET_KEY:}
      region: ${TESSERA_S3_REGION:}
      endpoint: ${TESSERA_S3_ENDPOINT:}
      # The browser-facing host a presigned link is signed against, when it differs from `endpoint`.
      # A redirect embeds the signing host, so an internal-only endpoint produces links no real client
      # can reach. Defaults to `endpoint` when unset.
      public-endpoint: ${TESSERA_S3_PUBLIC_ENDPOINT:}
      link-time-to-live: ${TESSERA_S3_LINK_TIME_TO_LIVE:15m}

    # Reclaims objects nothing points at any more — an avatar somebody replaced or cleared. Off by
    # default: the first run against real data is also the first honest measurement of how much has
    # been leaking, and that is worth watching rather than discovering. The grace period is not a
    # tuning knob — it is what stops the sweeper deleting an object written seconds ago by a
    # transaction that has not committed yet.
    sweeper:
      enabled: ${TESSERA_FILE_SWEEPER_ENABLED:false}
      grace-period: ${TESSERA_FILE_SWEEPER_GRACE_PERIOD:24h}

jmouse:
  # POST /api/blocks/resolve — how another product's document draws a Tessera row.
  #
  # ⚠️ THE SWITCH IS NOT CEREMONY. The library mounts the route and gates nothing; what protects it is
  # this product's authentication, its accepted-audiences and its CORS allowlist above. Publishing the
  # endpoint on the strength of the jar being on the classpath would open it to anyone who can reach
  # this application, which is why the library refuses to mount it until somebody says this line.
  liveblocks:
    enabled: ${TESSERA_LIVE_BLOCKS_ENABLED:true}

  # A member picture — preset, upload or drawn initials. The rules moved to jmouse-avatars; this row
  # still owns which of the three is worn.
  #
  # ⚠️ THE PUBLIC ROUTE IS OPT-IN, AND THAT IS A SECURITY DECISION RATHER THAN A FLAG.
  # /api/public/avatars/** is unauthenticated because an <img> tag cannot sign in, and what makes that
  # safe is `tessera.file.upload.profile` above: an allowlist with no script host in it. The library
  # cannot know whether this installation still holds that property, so it refuses to mount the route
  # until this line says so. ⚠️ Widening that profile — for logs on a bug report, say — means revisiting
  # this line in the same change.
  avatars:
    public-route:
      enabled: ${TESSERA_AVATAR_PUBLIC_ROUTE_ENABLED:true}
    # Separate from `tessera.file.max-size-bytes` on purpose: an avatar is a strictly smaller thing than
    # whatever else this installation accepts.
    max-size-bytes: ${TESSERA_AVATAR_MAX_SIZE_BYTES:1048576}

  # jmouse-storage reads its settings from wherever the product already publishes them, so this points
  # it at the `tessera.file.*` keys above rather than inventing a second place to configure storage.
  # The library's file routes, ON — and this is the one product that takes them rather than writing
  # its own, because an attachment hangs off an issue and needs no public byte route, no tree-wide
  # search and no share token.
  #
  # ⚠️ SWITCHED ON IN THE SAME CHANGE THAT DECLARES THEIR ACCESS (AttachmentsAccess). The controllers
  # carry no @RequiresAccess — an annotation would beat the product's own rule — so between the jar
  # arriving and the rules existing they would be un-gated. That window is what this flag removes.
  files:
    management:
      endpoints:
        enabled: ${TESSERA_FILE_ENDPOINTS_ENABLED:true}
      # OFF, and this is a product decision rather than a precaution: an attachment here hangs off the
      # issue it was dropped onto. There are no folders to arrange, nothing to browse, and no
      # StorageDirectory this product could resolve to a project — so the tree routes would answer every
      # call with a refusal that reads as a broken route rather than as an absent feature.
      directories:
        enabled: false

  storage:
    prefix: tessera.file
    # The sweep's cron lives here rather than under the product prefix: a @Scheduled expression is
    # resolved long before the settings record is bound, so it cannot follow a prefix that is itself
    # configuration. Whether the sweep does anything is still `tessera.file.sweeper.enabled`.
    sweeper:
      schedule: ${TESSERA_FILE_SWEEPER_SCHEDULE:0 0 3 * * *}

  ai:
    # Whose rows these are, where one installation's `ai_provider_settings` serves more than one
    # application — the same database already carries Innoventa's. This is the lookup key the
    # database-backed settings source filters every read and every write by.
    application: tessera

    # ⚠️ `source: database` IS THE WHOLE PROVIDER CONFIGURATION, AND IT IS ONE WORD ON PURPOSE. Which
    # provider answers, which model, the per-answer ceiling and the key are ROWS in
    # `ai_provider_settings`, administered under Administration → AI behind `ai:administer` — not a
    # file, a deploy and an environment variable somebody has to be trusted with. Rotating a leaked key
    # is a form and takes effect on the next request, because `JpaProviderSettingsSource` reads the row
    # per call rather than at startup.
    #
    # ⚠️ `name:` IS DELIBERATELY ABSENT, and adding it is the mistake to never make. It is what
    # `AiProviderAutoConfiguration` is conditional on, and its ChatModel would pick an implementation
    # from a property — the one thing that then cannot be changed on a screen. A blank value activates
    # that configuration and refuses to start; a real one quietly takes the choice away from the
    # screen. `AiConfiguration.aiChatModel` reads the provider from the same row as the model and key.
    #
    # ⚠️ This block used to say "do not add a `provider:` block back", which was true while nothing
    # bound it and became false the moment this product took the starter: without `source`, the
    # settings source and the provider administration are both @ConditionalOnProperty'd away, and the
    # application does not start.
    #
    # With no active row the assistant is simply off and `/assistant` says so — an installation with
    # tools and no model is a supported arrangement, since a connected Model Context Protocol client
    # reaches every action without one.
    provider:
      source: database

    # ⚠️ THE MANAGEMENT SCREENS ANSWER OUTSIDE `/api`, ON PURPOSE — every route under `prefix` below is
    # visibly not Tessera's, which is the point while this arrangement is new. The cost is that the
    # address is written in THREE places that nothing checks against each other: this key, the Vite
    # proxy entry, and `UI/src/api/ai.ts`'s base path. Drift between them 404s every management call,
    # and because those screens' queries raise no error of their own, the result reads as an
    # installation with no tools and no agents rather than as a routing mistake. Change one, change all.
    #
    # ⚠️ Being outside `/api` is not being outside authorization. Spring Security's second chain has no
    # matcher, so `anyRequest().authenticated()` reaches these; and `security/access/AiManagementAccess`
    # states what each of them requires, since a library's handler cannot carry @RequiresAccess itself.
    # `AccessDeclarationsTest` fails the build if one is mounted with nothing said about it.
    #
    # ⚠️ ON, and this key is load-bearing: the module being on the classpath is not enough, because
    # these endpoints publish a call history, a provider configuration and every agent in the
    # installation, and nothing inside the module guards them. `security/access/AiManagementAccess`
    # is what does — it states the requirement ABOUT each controller type, since a library's handler
    # cannot carry @RequiresAccess itself, and `AccessDeclarationsTest` fails the build if one is
    # mounted with nothing said about it.
    management:
      enabled: true
      # ⚠️ Set rather than left at the default, and set to something nobody would invent by accident.
      # A request log has to be able to say "this handler is the library's" at a glance — the reason the
      # same controller ended up hand-written in three products is that nothing about its address ever
      # said where it came from.
      prefix: /jmai/api

    # ⚠️ These were numbers in Java until this product took the starter, and they were numbers in Java
    # only because nothing was binding them. A tracker's bulk operation is a handful of issues rather
    # than a hundred rows, so the ceiling is lower than the library's default and confirmation starts
    # sooner — that is the one opinion here worth having.
    guards:
      per-call-ceiling: 50
      confirmation-threshold: 3
      confirmation-lifetime: 5m
      deduplication-window: 60s

      # Every guard this product believes it has, named. A chain missing one refuses to start rather
      # than running without protection somebody thinks is there.
      required:
        - rate-limit
        - ceiling
        - empty-destruction
        - confirmation
        - deduplication

    rate-limit:
      allowance: 60
      period: 1m

    conversation:
      maximum-rounds: 6
      maximum-tokens: 120000

  # The shared client-authorization flow — registration, authorization, the token endpoint and the
  # consent screen — served by jmouse-ai-mcp-authorization rather than written out here.
  mcp:
    authorization:
      # What the screen calls this installation, under the "jMouse MCP · Authorization" heading.
      application-name: Tessera

      # ⚠️ TWO ADDRESSES, AND IN DEVELOPMENT THEY ARE TWO SERVERS. `resource-url` is where a CLIENT
      # reaches this API and is what the discovery documents publish; `browser-url` is where a PERSON
      # reaches Tessera, which locally is the Vite dev server on 5050. The consent screen is served on
      # the browser address — through Vite's /api proxy — because it has to run on the same origin as
      # the interface to find the session that interface already stored. Building it from the API
      # address instead lands on a backend that serves no application and finds nothing.
      resource-url: ${TESSERA_MCP_RESOURCE_URL:${tessera.security.resource:http://localhost:8100}}
      browser-url: ${TESSERA_BROWSER_BASE_URL:http://localhost:5050}

      # A browser round trip plus a client's callback, and not a second more than that needs.
      code-lifetime: ${TESSERA_MCP_CODE_LIFETIME:120s}

      # ⚠️ These three used to be `tessera.mcp.*` fields assembled into a settings bean of this product's
      # own. They are the library's now (JMF-14) — the class that read them was written three times,
      # identically. The audience is stated rather than defaulted: an empty one mints a credential no
      # decoder can be made to refuse, so the library fails to start instead.
      #
      # ⚠️ ONE VALUE, AND IT NO LONGER FOLLOWS `tessera.security.*`. It used to read the resource
      # server's single audience; that property is now `accepted-audiences`, a LIST of who may call
      # this API — and a credential Tessera MINTS must carry exactly one `aud`, its own. Wiring the
      # two together again would stamp a protocol credential with somebody else's audience.
      audience: ${TESSERA_MCP_AUDIENCE:tessera}
      access-token-lifetime: ${TESSERA_MCP_ACCESS_TOKEN_LIFETIME:1h}
      refresh-token-lifetime: ${TESSERA_MCP_REFRESH_TOKEN_LIFETIME:30d}

      # ⚠️ ON, FOR ONE CLIENT THAT CANNOT BE LISTED. Codex registers a fresh nonce in the path it listens
      # on — http://127.0.0.1:<port>/callback/<nonce> — so there is no spelling of it to add to the
      # allowed paths, and exact matching refused it at registration. What this allows is a client's own
      # segments UNDER an already-allowed path, held to unreserved characters, on a loopback address it
      # already had to prove: those segments are routes inside that client's own listener, so nothing is
      # reachable that /callback did not already reach. The host, the explicit port, the absent query and
      # fragment, and PKCE are untouched. Turn it off for a deployment whose clients all use a bare path.
      allow-nested-redirect-paths: ${TESSERA_MCP_ALLOW_NESTED_REDIRECT_PATHS:true}

      consent:
        # Where oidc-client-ts keeps the signed-in user: one JSON document under a key built from the
        # issuer and the client identifier. ⚠️ Changing either of those in Tessera/UI changes this key,
        # and the only symptom is a consent screen that says nobody is signed in.
        token-storage-key: ${TESSERA_MCP_TOKEN_STORAGE_KEY:oidc.user:http://localhost:9090:tessera-web}
        token-storage-field: access_token
        sign-in-route: /

  access:
    policy:
      # ⚠️ NO LOCATIONS MEANS THE FEATURE IS OFF — no bean appears at all, the document is never read,
      # and the seed never runs. A location that IS configured and matches nothing is the opposite case
      # and refuses to start, which is the failure worth having: somebody asked for a file.
      name: tessera
      locations:
        - classpath:policy/tessera.jmp
        # ⚠️ The SECOND axis, in its own document: whether an action may be reached through a tool at
        # all, as opposed to what the action does. Listed explicitly rather than reached by a glob —
        # a location that matches nothing refuses to start, which is the failure worth having, and a
        # pattern silently matching one file fewer is not.
        - classpath:policy/tools.jmp

logging:
  level:
    net.innoventa.tessera: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr([%15.15t]){faint} %clr(%-40.40logger{36}){cyan} : %msg%n"

---
spring:
  config:
    activate:
      on-profile: postgresql
  datasource:
    url: ${TESSERA_DB_URL:jdbc:postgresql://localhost:5432/tessera}
    username: ${TESSERA_DB_USERNAME:tessera}
    password: ${TESSERA_DB_PASSWORD:tessera}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TESSERA-POOL
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    locations: classpath:db/migration/postgresql
    out-of-order: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

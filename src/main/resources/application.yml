spring:
  application:
    name: tessera-api

  config:
    import: classpath:application-sensitive.yml

  # MySQL is the no-flag default, the same shape every product in this workspace now uses. H2 used
  # to be the default here and is gone entirely: an H2 file running MODE=PostgreSQL made local dev
  # green against a dialect nothing is ever deployed on, so a MySQL-only failure was only ever
  # discovered later. PostgreSQL stays available as the opt-in `postgresql` profile below.
  datasource:
    url: ${TESSERA_DB_URL:jdbc:mysql://localhost:3306/tessera?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${TESSERA_DB_USERNAME:tessera}
    password: ${TESSERA_DB_PASSWORD:tessera}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TESSERA-POOL
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    # ⚠️ 0, and it is load-bearing rather than tidy. `baseline-on-migrate` baselines a NON-EMPTY schema
    # at `baseline-version`, which defaults to 1 — and Tessera's first migration IS version 1, so it
    # would be skipped as "already applied". That never happened while this schema started empty. It
    # starts non-empty now: `jmouse-ai-jpa` brings its own migrations and its own history table, and
    # they run first so the entity manager can validate against the tables they create.
    #
    # Central hit exactly this and failed on V000002 with "table `translations` doesn't exist" — two
    # steps from the cause. At 0 the baseline sits below everything and every migration still applies.
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TESSERA_IDENTITY_JWK_SET_URI:http://localhost:9090/oauth2/jwks}

  jackson:
    # No `default-property-inclusion: non_null` here, deliberately. Omitting a null field makes the API
    # disagree with the DTO that declares it: the client's mirror types say `string[] | null`, the field
    # arrives as `undefined`, and every `=== null` written against it is silently always false. That is
    # not theoretical — it is what made the board hide every card until a filter was applied, because
    # `matchedCardIds` (null = "no filter was evaluated") simply was not in the payload. A nullable field
    # is part of the contract, so it is sent.
    # ⚠️ Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS out of SerializationFeature into DateTimeFeature, so
    # it lives under `datatype.datetime` now — and the old `serialization.write-dates-as-timestamps` key
    # is simply ignored rather than rejected. Left where it was, every date in the API would have
    # flipped to an epoch number at once, and the client parses them as ISO-8601 strings.
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # The one multipart route in the whole service is an avatar upload, and the interface has already
  # cropped and downscaled the image to a 256x256 PNG before it is sent — see UI/src/lib/squareImage.ts.
  # So these are not a policy, they are a backstop against a client that skipped that step: what a real
  # avatar weighs is tens of kilobytes, and `tessera.file.max-size-bytes` is the limit that actually
  # refuses, with a message a person can read. This one only stops the socket.
  servlet:
    multipart:
      max-file-size: ${TESSERA_MULTIPART_MAX_FILE_SIZE:4MB}
      max-request-size: ${TESSERA_MULTIPART_MAX_REQUEST_SIZE:4MB}

server:
  port: ${TESSERA_SERVER_PORT:8100}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

tessera:
  security:
    # The single audience this resource server accepts. A token's `aud` claim must contain this
    # exact value — the `tessera` client registered in Identity's application.yml stamps it onto
    # every access token it mints for this app (see SecurityConfiguration.jwtDecoder). Unlike
    # Central, Tessera is only ever called by its own frontend, so one fixed value, not an
    # allow-list.
    audience: ${TESSERA_AUDIENCE:tessera}

    # What this server calls itself: the address a client reaches this API at. Published at
    # /.well-known/oauth-protected-resource as both the resource being protected AND the authorization
    # server that issues credentials for it — Tessera issues the protocol's own, see
    # SecurityConfiguration for why that stopped being Identity's job.
    #
    # ⚠️ IN A DEPLOYMENT THIS IS THE PUBLIC ADDRESS, and it has to match what the client was pointed at
    # scheme-and-host exactly: a client refuses a resource whose origin differs from the server URL it
    # was configured with. Behind a reverse proxy that means the proxy must also forward
    # /.well-known/** to this backend, or discovery is answered with the frontend's HTML.
    resource: ${TESSERA_RESOURCE:http://localhost:8100}

  # The Model Context Protocol's authorization flow — see McpAuthorizationConfiguration.
  mcp:
    # ⚠️ UNSET MEANS "GENERATE ONE PER RUN", which is right on a laptop and wrong everywhere else: every
    # credential dies on restart, and two instances refuse each other's. At least 32 bytes or the
    # application refuses to start — that failure belongs at boot, not at somebody's first connection.
    signing-secret: ${TESSERA_MCP_SIGNING_SECRET:}

    access-token-lifetime: ${TESSERA_MCP_ACCESS_TOKEN_LIFETIME:1h}
    # How long a client may keep renewing before a person approves again.
    refresh-token-lifetime: ${TESSERA_MCP_REFRESH_TOKEN_LIFETIME:30d}

  bootstrap:
    owner: ${TESSERA_BOOTSTRAP_OWNER:SU}

  # Bytes, read by jmouse-storage under the prefix declared in `jmouse.storage.prefix` below.
  #
  # Tessera stores one kind of file: a member's uploaded avatar. Everything here is sized for that and
  # for nothing else, which is why the limit is a megabyte rather than the tens Innoventa and Moneta
  # allow — an avatar arrives already cropped to 256x256, so anything approaching this ceiling is a
  # client that did not do that, and refusing it is correct.
  file:
    # local | aws | minio | supabase — the last three all speak S3. Switching is a change here and
    # nowhere else; a stored row records which backend wrote it, so files already written keep being
    # served from wherever they are.
    provider: ${TESSERA_FILE_PROVIDER:local}
    storage-directory: ${TESSERA_FILE_STORAGE_DIR:./uploads}
    max-size-bytes: ${TESSERA_FILE_MAX_SIZE_BYTES:1048576}

    # ⚠️ AN ALLOWLIST, AND A NARROW ONE, because unlike Innoventa's file cabinet this accepts exactly
    # one thing: a picture of a person. Neither shipped profile fits — ALLOW_DOCUMENTS_AND_IMAGES also
    # admits PDF and Office documents, which an avatar route has no business taking.
    #
    # ⚠️ SVG IS ABSENT ON PURPOSE. It is an image by every intuition and a script host by
    # specification, and /api/public/avatars/** serves its bytes unauthenticated — see
    # PublicAvatarController for why that route is public and why this is the line that makes it safe.
    #
    # ⚠️ A SHIPPED PROFILE, BECAUSE `CUSTOM` DOES NOT WORK IN THE LIBRARY AS OF 1.0.0-b20260802.
    # Writing the lists out by hand fails both ways it can be written: a YAML sequence arrives as
    # `…content-types[0]`, `[1]`, … and StorageSettingsBinder's name-walk turns those into keys
    # literally called `contentTypes[0]`, so the allowlist binds EMPTY and every upload is refused
    # with "File type 'image/png' is not allowed"; a comma-separated string binds far enough to reach
    # CollectionBinder, which then cannot resolve `Set<String>`'s element type and fails the whole
    # application at boot with "No binder found for bindable type 'Object'". Innoventa and Moneta
    # never met either because both use a shipped profile and declare no lists at all.
    #
    # ⚠️ SO THIS IS THE BRACES AND `MemberAvatarService.ACCEPTED_PICTURE_TYPES` IS THE BELT.
    # This profile is an allowlist that excludes SVG, HTML and every script host — which is the
    # property the public byte route actually depends on — but it also admits PDF and Office
    # documents, which an avatar endpoint has no business taking. Tessera narrows it to raster images
    # in its own code rather than loosening what the route may serve. Delete that narrowing only
    # after `CUSTOM` binds.
    upload:
      profile: ALLOW_DOCUMENTS_AND_IMAGES

    # Every avatar is content-addressed, so two people who pick the same picture cost one object.
    content-addressed-keys: ${TESSERA_FILE_CONTENT_ADDRESSED_KEYS:true}

    cache:
      # An avatar URL names a content digest, so its bytes can never change under a cached copy —
      # replacing your picture produces a different URL. The only thing a long lifetime costs is a
      # stale image for somebody who was deleted, which is not a thing that happens.
      streamed-public-max-age: ${TESSERA_FILE_CACHE_PUBLIC_MAX_AGE:365d}
      streamed-private-max-age: ${TESSERA_FILE_CACHE_PRIVATE_MAX_AGE:1h}
      redirect-safety-margin: ${TESSERA_FILE_REDIRECT_SAFETY_MARGIN:1m}

    s3:
      bucket: ${TESSERA_S3_BUCKET:tessera}
      access-key: ${TESSERA_S3_ACCESS_KEY:}
      secret-key: ${TESSERA_S3_SECRET_KEY:}
      region: ${TESSERA_S3_REGION:}
      endpoint: ${TESSERA_S3_ENDPOINT:}
      # The browser-facing host a presigned link is signed against, when it differs from `endpoint`.
      # A redirect embeds the signing host, so an internal-only endpoint produces links no real client
      # can reach. Defaults to `endpoint` when unset.
      public-endpoint: ${TESSERA_S3_PUBLIC_ENDPOINT:}
      link-time-to-live: ${TESSERA_S3_LINK_TIME_TO_LIVE:15m}

    # Reclaims objects nothing points at any more — an avatar somebody replaced or cleared. Off by
    # default: the first run against real data is also the first honest measurement of how much has
    # been leaking, and that is worth watching rather than discovering. The grace period is not a
    # tuning knob — it is what stops the sweeper deleting an object written seconds ago by a
    # transaction that has not committed yet.
    sweeper:
      enabled: ${TESSERA_FILE_SWEEPER_ENABLED:false}
      grace-period: ${TESSERA_FILE_SWEEPER_GRACE_PERIOD:24h}

jmouse:
  # jmouse-storage reads its settings from wherever the product already publishes them, so this points
  # it at the `tessera.file.*` keys above rather than inventing a second place to configure storage.
  storage:
    prefix: tessera.file
    # The sweep's cron lives here rather than under the product prefix: a @Scheduled expression is
    # resolved long before the settings record is bound, so it cannot follow a prefix that is itself
    # configuration. Whether the sweep does anything is still `tessera.file.sweeper.enabled`.
    sweeper:
      schedule: ${TESSERA_FILE_SWEEPER_SCHEDULE:0 0 3 * * *}

  ai:
    # Whose rows these are, where one installation's `ai_provider_settings` serves more than one
    # application — the same database already carries Innoventa's. This is the lookup key the
    # database-backed settings source filters every read and every write by.
    application: tessera

    # ⚠️ THERE IS DELIBERATELY NOTHING ELSE HERE, AND THAT IS THE POINT. The provider, the model, the
    # per-answer ceiling and the key are ROWS in `ai_provider_settings`, administered under
    # Administration → AI behind `ai:administer` — not a file, a deploy and an environment variable
    # somebody has to be trusted with. Rotating a leaked key is a form and takes effect on the next
    # request, because `JpaProviderSettingsSource` reads the row per call rather than at startup.
    #
    # ⚠️ Do not "helpfully" add a `provider:` block back. It would be bound by nothing (`AiConfiguration`
    # no longer has the property class) and would read as the real configuration to the next person.
    #
    # With no active row the assistant is simply off and `/assistant` says so — an installation with
    # tools and no model is a supported arrangement, since a connected Model Context Protocol client
    # reaches every action without one.

    # ⚠️ THE MANAGEMENT SCREENS ANSWER AT THE LIBRARY'S OWN DEFAULT, `/jmouse-ai`, ON PURPOSE — every
    # route under it is visibly not Tessera's, which is the point while this arrangement is new. Moving
    # them under `/api/ai` is one `management.prefix:` line here plus the matching entry in the Vite
    # proxy, and nothing else.
    #
    # ⚠️ Being outside `/api` is not being outside authorization. Spring Security's second chain has no
    # matcher, so `anyRequest().authenticated()` reaches these; and `security/access/AiManagementAccess`
    # states what each of them requires, since a library's handler cannot carry @RequiresAccess itself.
    # `AccessDeclarationsTest` fails the build if one is mounted with nothing said about it.
    #
    # ⚠️ There is no `management.enabled: true` because that key is what the STARTER reads, and there is
    # no starter here — the six controllers are declared by hand in `config/AiConfiguration`.

  # The shared client-authorization flow — registration, authorization, the token endpoint and the
  # consent screen — served by jmouse-ai-mcp-authorization rather than written out here.
  mcp:
    authorization:
      # What the screen calls this installation, under the "jMouse MCP · Authorization" heading.
      application-name: Tessera

      # ⚠️ TWO ADDRESSES, AND IN DEVELOPMENT THEY ARE TWO SERVERS. `resource-url` is where a CLIENT
      # reaches this API and is what the discovery documents publish; `browser-url` is where a PERSON
      # reaches Tessera, which locally is the Vite dev server on 5050. The consent screen is served on
      # the browser address — through Vite's /api proxy — because it has to run on the same origin as
      # the interface to find the session that interface already stored. Building it from the API
      # address instead lands on a backend that serves no application and finds nothing.
      resource-url: ${TESSERA_MCP_RESOURCE_URL:${tessera.security.resource:http://localhost:8100}}
      browser-url: ${TESSERA_BROWSER_BASE_URL:http://localhost:5050}

      # A browser round trip plus a client's callback, and not a second more than that needs.
      code-lifetime: ${TESSERA_MCP_CODE_LIFETIME:120s}

      consent:
        # Where oidc-client-ts keeps the signed-in user: one JSON document under a key built from the
        # issuer and the client identifier. ⚠️ Changing either of those in Tessera/UI changes this key,
        # and the only symptom is a consent screen that says nobody is signed in.
        token-storage-key: ${TESSERA_MCP_TOKEN_STORAGE_KEY:oidc.user:http://localhost:9090:tessera-web}
        token-storage-field: access_token
        sign-in-route: /

  access:
    policy:
      # ⚠️ NO LOCATIONS MEANS THE FEATURE IS OFF — no bean appears at all, the document is never read,
      # and the seed never runs. A location that IS configured and matches nothing is the opposite case
      # and refuses to start, which is the failure worth having: somebody asked for a file.
      name: tessera
      locations:
        - classpath:policy/tessera.jmp

logging:
  level:
    net.innoventa.tessera: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr([%15.15t]){faint} %clr(%-40.40logger{36}){cyan} : %msg%n"

---
spring:
  config:
    activate:
      on-profile: postgresql
  datasource:
    url: ${TESSERA_DB_URL:jdbc:postgresql://localhost:5432/tessera}
    username: ${TESSERA_DB_USERNAME:tessera}
    password: ${TESSERA_DB_PASSWORD:tessera}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TESSERA-POOL
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    locations: classpath:db/migration/postgresql
    out-of-order: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

spring:
  application:
    name: tessera-api

  config:
    import: classpath:application-sensitive.yml

  # H2 file is the no-flag default — Tessera boots with zero external dependencies for local dev,
  # matching Innoventa/BE, Moneta/BE and Identity's business-app convention (Central is the lone
  # MySQL-first exception, for reasons specific to it being the shared source of truth). Opt into
  # MySQL or PostgreSQL via the profiles below for anything closer to production.
  datasource:
    url: jdbc:h2:file:./H2/H2DB;AUTO_SERVER=TRUE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: TESSERA-POOL
      maximum-pool-size: 5
      minimum-idle: 2
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${TESSERA_IDENTITY_JWK_SET_URI:http://localhost:9090/oauth2/jwks}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

server:
  port: ${TESSERA_SERVER_PORT:8100}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

tessera:
  security:
    # The single audience this resource server accepts. A token's `aud` claim must contain this
    # exact value — the `tessera` client registered in Identity's application.yml stamps it onto
    # every access token it mints for this app (see SecurityConfiguration.jwtDecoder). Unlike
    # Central, Tessera is only ever called by its own frontend, so one fixed value, not an
    # allow-list.
    audience: ${TESSERA_AUDIENCE:tessera}

logging:
  level:
    net.innoventa.tessera: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr([%15.15t]){faint} %clr(%-40.40logger{36}){cyan} : %msg%n"

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${TESSERA_DB_URL:jdbc:mysql://localhost:3306/tessera?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${TESSERA_DB_USERNAME:tessera}
    password: ${TESSERA_DB_PASSWORD:tessera}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TESSERA-POOL
      maximum-pool-size: 10
      minimum-idle: 2
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration/mysql
    out-of-order: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
spring:
  config:
    activate:
      on-profile: postgresql
  datasource:
    url: ${TESSERA_DB_URL:jdbc:postgresql://localhost:5432/tessera}
    username: ${TESSERA_DB_USERNAME:tessera}
    password: ${TESSERA_DB_PASSWORD:tessera}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TESSERA-POOL
      maximum-pool-size: 10
      minimum-idle: 2
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration/postgresql
    out-of-order: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
